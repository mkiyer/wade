# The contributor environment: everything needed to build the kernel, run the
# full test suite and render the notebooks. End users do not need this;
# `pip install wade-rnaseq` is the install (README.md).
#
#   mamba env create -f mamba_env.yaml && conda activate wade
#   pip install -e . --no-build-isolation
name: wade
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - pip
  # Runtime: keep in step with pyproject.toml.
  - numpy>=1.24
  # Build toolchain for the Rust kernel, inside the environment.
  - rust>=1.75
  - maturin>=1.5,<2
  # The optional extras (io, plot, saddlepoint).
  - polars
  - plotly>=6
  - matplotlib-base>=3.8
  - anywidget
  - scipy>=1.10
  # Tests.
  - pytest>=7
  - pandas>=2.0
  # Notebooks (notebooks/*.qmd). Quarto itself is installed separately
  # (https://quarto.org); python-kaleido is plotly's static export and needs a
  # Chrome/Chromium on the machine.
  - ipykernel
  - pyyaml
  - fastexcel
  - python-kaleido>=1.0
