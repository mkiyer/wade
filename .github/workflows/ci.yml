name: CI

on:
  push:
    branches: [main]
    # A version tag is the release trigger: everything below runs, and only
    # if all of it is green do the wheels reach PyPI.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built wheels and sdist to PyPI"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that might be uploading.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The tag says which version is being released; pyproject says which version
  # will be built. If they disagree the upload is mislabeled, and a PyPI
  # version can never be reused — so this fails in twenty seconds rather than
  # after the matrix.
  version:
    name: tag matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag $GITHUB_REF_NAME -> $tag;  pyproject -> $declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag but pyproject.toml declares $declared. Bump the version and re-tag; do not publish a mislabeled release."
            exit 1
          fi

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,io,plot]"
      - name: Lint the kernel
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: pytest -q
      - name: Check workspace boundaries and links
        run: python tools/check_workspace.py

  oldest-numpy:
    name: numpy floor (1.24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "numpy==1.24.*"
          pytest -q -m "not validation"

  no-kernel:
    name: NumPy fallback (kernel removed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, then delete the kernel and run the readable path
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,io]"
          find src/wade -name "_kernel*.so" -delete
          python -c "from wade._wasserstein import HAVE_RUST_KERNEL; assert not HAVE_RUST_KERNEL"
          pytest -q -m "not kernel"

  wheels:
    name: wheel / ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One row per wheel PyPI needs. abi3-py310 means a single wheel per
        # platform covers every supported Python. Every row builds on a native
        # runner, so every wheel is import-tested.
        include:
          - { os: ubuntu-latest,    target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: windows-latest,   target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - name: Check the installed wheel computes with its kernel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install the declared dependency first, then the wheel from dist and
          # nowhere else, so nothing is pulled from PyPI under the same name.
          pip install "numpy>=1.24"
          pip install --no-index --find-links dist --no-deps wade-rnaseq
          # A wheel that silently fell back to NumPy is the failure this job
          # exists to catch.
          python tools/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with: { command: sdist, args: --out dist }
      - name: Check the sdist builds from scratch
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import pathlib, tarfile
          archive = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive) as bundle:
              assert not any(name.endswith("/notebooks/rna100k.qmd") for name in bundle.getnames())
              paths = [pathlib.PurePosixPath(name).parts[1:] for name in bundle.getnames()]
              assert not any(p and p[0] in {"archive", "research", ".release"} for p in paths)
          PY
          pip install dist/*.tar.gz
          python tools/smoke_install.py
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  # Publishing happens on a version tag, and nothing reaches PyPI that has not
  # passed the whole matrix above. `workflow_dispatch` with `publish` checked
  # stays as the escape hatch for re-running a failed upload without cutting a
  # new tag.
  #
  # A PyPI upload cannot be undone and a version can never be reused, so the
  # `pypi` environment is the place to add a required reviewer if you want a
  # human confirmation in front of every release.
  #
  # Authentication is a PyPI trusted publisher for this repo, keyed on
  # (owner, repo, workflow file, environment) — not on the trigger — so
  # nothing needs changing on PyPI to move from a button to a tag.
  publish:
    needs: [version, test, oldest-numpy, no-kernel, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub Release, with the same artifacts attached, once PyPI has them.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
