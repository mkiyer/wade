name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built wheels and sdist to PyPI"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floors declared in pyproject (requires-python >=3.10, numpy>=1.24)
        # were never exercised; this is what makes them claims rather than hopes.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No --no-build-isolation here: that flag needs maturin already
          # importable, which the conda env supplies and setup-python does
          # not. Let pip build in isolation and fetch it.
          pip install -e ".[test,io,plot,linked]" pandas
      - name: Test
        run: pytest -q

  oldest-numpy:
    name: numpy floor (1.24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "numpy==1.24.*"
          pytest -q -m "not validation"

  no-kernel:
    name: NumPy fallback (kernel removed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, then delete the kernel and run the readable path
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,io]"
          find src/wade -name "_kernel*.so" -delete
          python -c "import wade; assert not wade.permutation.HAVE_RUST_KERNEL"
          pytest -q -m "not kernel"

  wheels:
    name: wheel / ${{ matrix.target }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One row per wheel PyPI needs. abi3-py310 means a single wheel per
        # platform covers every supported Python, so this matrix is the whole
        # distribution. Two rows cross-compile and cannot run what they build:
        # aarch64 Linux (built in a QEMU container) and x86_64 macOS (built on
        # an arm64 runner). `native` gates the smoke test rather than dropping
        # those platforms, which is how users on them end up needing a Rust
        # toolchain.
        include:
          # `manylinux: auto` is the action's own default and is ignored off
          # Linux, so every row can carry it rather than the matrix growing a
          # conditional.
          - { os: ubuntu-latest,  target: x86_64,             native: true  }
          - { os: ubuntu-latest,  target: aarch64,            native: false }
          - { os: macos-latest,   target: aarch64-apple-darwin, native: true  }
          - { os: macos-latest,   target: x86_64-apple-darwin, native: false }
          - { os: windows-latest, target: x64,                native: true  }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # maturin-action installs the Rust target it needs for a cross build;
      # naming it here too means a missing target fails at setup with a clear
      # message rather than midway through cargo.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.target, '-') && matrix.target || '' }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - name: Check the wheel installs and imports on its own
        if: matrix.native
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # --no-index must not reach the dependencies: it would block numpy
          # as well as PyPI's wade. Install the declared deps first, then
          # the wheel itself from dist and nowhere else.
          pip install "numpy>=1.24"
          pip install --no-index --find-links dist --no-deps wade
          # The kernel must be present in the wheel: a wheel that silently
          # fell back to NumPy is the failure this job exists to catch.
          python -c "import wade; assert wade.permutation.HAVE_RUST_KERNEL, \
              'wheel has no compiled kernel'; print(wade.__version__, 'kernel ok')"
          python -c "import wade.plotting as P; print(P.available_backends())"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: PyO3/maturin-action@v1
        with: { command: sdist, args: --out dist }
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  # Deliberately NOT triggered by a tag. A PyPI upload cannot be undone and a
  # version number cannot be reused, so publishing is a button press: run the
  # workflow manually with `publish` checked. Everything above it still runs
  # first, so nothing reaches PyPI that has not passed the full matrix.
  #
  # Needs a PyPI trusted publisher for this repo (pypi.org -> the project ->
  # Publishing), and a GitHub environment named `pypi`. No API token.
  publish:
    needs: [test, oldest-numpy, no-kernel, wheels, sdist]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
