[package]
name = "wade-kernel"
# Unused: the crate is never published on its own. The package is versioned
# in pyproject.toml.
version = "0.0.0"
edition = "2021"
rust-version = "1.88"                   # slice::as_chunks
description = "Permutation-loop kernel for WADE (Wasserstein Area Differential Expression)"
license = "GPL-3.0-only"

[lib]
name = "_kernel"
path = "rust/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310 matches requires-python: one wheel per platform works on
# every supported Python, instead of one per platform per minor version.
# extension-module comes from pyproject.toml's maturin features, so that
# cargo can also link the crate on its own.
pyo3 = { version = "0.27", features = ["abi3-py310"] }
numpy = "0.27"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
