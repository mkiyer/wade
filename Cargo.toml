[package]
name = "wade-kernel"
version = "0.1.0"
edition = "2021"
description = "Permutation-loop kernel for WADE (Wasserstein Area Differential Expression)"
license = "MIT"

[lib]
name = "_kernel"
path = "rust/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
numpy = "0.27"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
