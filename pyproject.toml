[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "wade"
version = "0.1.0.dev0"
description = "Wasserstein Area Differential Expression — a quantile-area differential-distribution test built for subset detection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10"]
# Plotting is optional and imported inside the plotting functions, so the
# statistic keeps its one-dependency surface. Either backend alone works;
# `plot` installs both (plotly is the default when both are present).
plot = ["plotly>=6", "matplotlib>=3.8"]
# Results out: to_frame() and write_results() build a polars DataFrame. Reading
# data files is deliberately NOT WADE's job (ROADMAP.md 1) — polars is here for
# the output side, and whatever you use to read your counts is your choice.
io = ["polars>=1.0"]
plotly = ["plotly>=6"]
matplotlib = ["matplotlib>=3.8"]

[tool.maturin]
python-source = "src"
module-name = "wade._kernel"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parity: asserts agreement with the R reference on golden fixtures",
    "slow: takes more than a few seconds",
    "validation: method-validation simulations, not parity",
    "kernel: requires the compiled Rust kernel",
]
