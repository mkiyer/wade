[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
# The distribution is `wade-rnaseq` (the PyPI name `wade` belongs to an unrelated
# project); the import name is `wade`.
name = "wade-rnaseq"
version = "0.1.0"
description = "Wasserstein Area Differential Expression: a two-stage differential-distribution test for RNA-seq counts, built for subset detection"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Iyer", email = "mkiyer@umich.edu" }]
keywords = ["differential-expression", "rna-seq", "wasserstein", "permutation-test",
            "cfrna", "subset-detection", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/mkiyer/wade"
Repository = "https://github.com/mkiyer/wade"
Issues = "https://github.com/mkiyer/wade/issues"

[project.optional-dependencies]
# Everything the statistic needs is NumPy. Each extra adds one capability.
io = ["polars>=1.0"]                                  # to_frame() and write_results()
plot = ["plotly>=6", "matplotlib>=3.8", "anywidget>=0.9"]   # the figures; either backend alone works
saddlepoint = ["scipy>=1.10"]                         # stage1="saddlepoint"
all = ["polars>=1.0", "plotly>=6", "matplotlib>=3.8", "anywidget>=0.9", "scipy>=1.10"]
test = ["pytest>=7", "scipy>=1.10", "polars>=1.0", "pandas>=2.0"]

[tool.maturin]
python-source = "src"
module-name = "wade._kernel"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parity: asserts agreement with the committed golden fixtures",
    "validation: method-validation simulations, not parity",
    "kernel: requires the compiled Rust kernel",
]
